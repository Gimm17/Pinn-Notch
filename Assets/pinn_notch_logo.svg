<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161828"/>
      <stop offset="50%" stop-color="#0e101a"/>
      <stop offset="100%" stop-color="#080910"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="30%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="dockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e45" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121420" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="eyeIrisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect x="44" y="44" width="424" height="424" rx="96" fill="none" stroke="url(#borderGrad)" stroke-width="14" opacity="0.25" filter="url(#glow)"/>

  <!-- Main Container Squircle -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" filter="url(#shadow)"/>

  <!-- Ambient Light Reflection inside top -->
  <path d="M 70 80 Q 256 60 442 80" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>

  <!-- ================= NOTCH ISLAND CAPSULE ================= -->
  <g transform="translate(0, -6)">
    <!-- Notch Island Pill -->
    <rect x="96" y="112" width="320" height="88" rx="44" fill="#07080e" stroke="#262a40" stroke-width="2.5" filter="url(#shadow)"/>
    
    <!-- Notch specular edge -->
    <path d="M 140 114 Q 256 114 372 114" stroke="#ffffff" stroke-width="1" opacity="0.2" fill="none" stroke-linecap="round"/>

    <!-- ================= PINN THE MASCOT ================= -->
    <g id="pinnTheCat" transform="translate(256, 116)">
      <!-- Headphone Band -->
      <path d="M -58 -10 Q 0 -68 58 -10" fill="none" stroke="url(#bandGrad)" stroke-width="8" stroke-linecap="round" filter="url(#subtleGlow)"/>
      
      <!-- Left Ear (Behind head) -->
      <path d="M -46 -6 L -62 -48 L -24 -24 Z" fill="#fffcf8" stroke="#1e1b4b" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M -44 -8 L -56 -40 L -27 -23 Z" fill="#ffb6c1"/>

      <!-- Right Ear (Behind head) -->
      <path d="M 24 -24 L 62 -48 L 46 -6 Z" fill="#fffcf8" stroke="#1e1b4b" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 27 -23 L 56 -40 L 44 -8 Z" fill="#ffb6c1"/>

      <!-- Chubby Head -->
      <ellipse cx="0" cy="2" rx="54" ry="40" fill="#fffcf8" stroke="#1e1b4b" stroke-width="3.5"/>

      <!-- Cheek Blushes -->
      <ellipse cx="-34" cy="11" rx="9" ry="6" fill="#fb7185" opacity="0.75"/>
      <ellipse cx="34" cy="11" rx="9" ry="6" fill="#fb7185" opacity="0.75"/>
      <!-- Blush Sparkles -->
      <circle cx="-36" cy="9" r="1.8" fill="#ffffff" opacity="0.8"/>
      <circle cx="36" cy="9" r="1.8" fill="#ffffff" opacity="0.8"/>

      <!-- Whiskers -->
      <path d="M -42 2 L -64 -2 M -43 10 L -66 12" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 42 2 L 64 -2 M 43 10 L 66 12" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Left Eye -->
      <g transform="translate(-20, -1)">
        <ellipse cx="0" cy="0" rx="11" ry="14" fill="url(#eyeIrisGrad)"/>
        <!-- Main sparkle -->
        <circle cx="-3.5" cy="-5" r="4.2" fill="#ffffff"/>
        <!-- Secondary sparkle -->
        <circle cx="3.5" cy="5" r="2.2" fill="#ffffff"/>
      </g>

      <!-- Right Eye -->
      <g transform="translate(20, -1)">
        <ellipse cx="0" cy="0" rx="11" ry="14" fill="url(#eyeIrisGrad)"/>
        <!-- Main sparkle -->
        <circle cx="-3.5" cy="-5" r="4.2" fill="#ffffff"/>
        <!-- Secondary sparkle -->
        <circle cx="3.5" cy="5" r="2.2" fill="#ffffff"/>
      </g>

      <!-- Nose -->
      <ellipse cx="0" cy="7" rx="3.5" ry="2.5" fill="#fb7185"/>

      <!-- Cute Cat Mouth (ω) -->
      <path d="M -8 11 Q -4 16 0 12 Q 4 16 8 11" fill="none" stroke="#1e1b4b" stroke-width="2.8" stroke-linecap="round"/>

      <!-- Headphone Ear Cups -->
      <g transform="translate(-58, 2)">
        <rect x="-10" y="-18" width="18" height="36" rx="9" fill="url(#headphoneGrad)" stroke="#be123c" stroke-width="2.5" filter="url(#subtleGlow)"/>
        <line x1="-1" y1="-8" x2="-1" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </g>
      <g transform="translate(58, 2)">
        <rect x="-8" y="-18" width="18" height="36" rx="9" fill="url(#headphoneGrad)" stroke="#be123c" stroke-width="2.5" filter="url(#subtleGlow)"/>
        <line x1="1" y1="-8" x2="1" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </g>

      <!-- Little Paws resting on Notch -->
      <ellipse cx="-24" cy="38" rx="10" ry="7" fill="#fffcf8" stroke="#1e1b4b" stroke-width="3"/>
      <ellipse cx="24" cy="38" rx="10" ry="7" fill="#fffcf8" stroke="#1e1b4b" stroke-width="3"/>
    </g>

    <!-- Notch Mini Telemetry Icons inside capsule -->
    <!-- Left: Rigid Speed Badge -->
    <g transform="translate(116, 144)">
      <circle cx="14" cy="10" r="10" fill="#0284c7" opacity="0.2"/>
      <path d="M 14 6 L 14 14 M 11 11 L 14 14 L 17 11" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Right: Apple Battery Badge -->
    <g transform="translate(362, 144)">
      <rect x="0" y="4" width="24" height="12" rx="3" fill="none" stroke="#4ade80" stroke-width="1.8"/>
      <rect x="2" y="6" width="16" height="8" rx="1.5" fill="#22c55e"/>
      <path d="M 25 7 Q 26 7 26 8 L 26 12 Q 26 13 25 13" stroke="#4ade80" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- ================= FLOATING DOCK PREVIEW (BOTTOM) ================= -->
  <g transform="translate(0, 14)">
    <!-- Dock Frosted Glass Background -->
    <rect x="84" y="266" width="344" height="76" rx="38" fill="url(#dockGrad)" stroke="#3b4261" stroke-width="2" filter="url(#shadow)"/>
    <path d="M 120 268 Q 256 268 392 268" stroke="#ffffff" stroke-width="1" opacity="0.25" fill="none" stroke-linecap="round"/>

    <!-- Dock App Icons -->
    <!-- Icon 1: Grid Apps -->
    <g transform="translate(104, 282)">
      <rect x="0" y="0" width="44" height="44" rx="12" fill="#475569"/>
      <circle cx="16" cy="16" r="3.5" fill="#ffffff"/>
      <circle cx="28" cy="16" r="3.5" fill="#ffffff"/>
      <circle cx="16" cy="28" r="3.5" fill="#ffffff"/>
      <circle cx="28" cy="28" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Icon 2: Finder / Shell -->
    <g transform="translate(158, 280)">
      <rect x="0" y="0" width="48" height="48" rx="14" fill="#3b82f6" filter="url(#subtleGlow)"/>
      <path d="M 16 18 Q 24 12 32 18 Q 28 32 24 36 Q 20 32 16 18 Z" fill="#ffffff" opacity="0.9"/>
      <circle cx="24" cy="20" r="3" fill="#1d4ed8"/>
    </g>

    <!-- Icon 3: Music (Centerpiece - Dancing) -->
    <g transform="translate(216, 274)">
      <rect x="0" y="0" width="58" height="58" rx="16" fill="url(#borderGrad)" filter="url(#subtleGlow)"/>
      <path d="M 24 38 L 24 22 L 38 18 L 38 34 M 24 38 A 5 4 0 1 1 19 34 A 5 4 0 1 1 24 38 M 38 34 A 5 4 0 1 1 33 30 A 5 4 0 1 1 38 34" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Active indicator dot -->
      <circle cx="29" cy="63" r="2.5" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Icon 4: Terminal -->
    <g transform="translate(284, 280)">
      <rect x="0" y="0" width="48" height="48" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <path d="M 14 18 L 22 24 L 14 30 M 24 30 L 34 30" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Icon 5: Speed / Status Widget Pill inside Dock -->
    <g transform="translate(342, 282)">
      <rect x="0" y="0" width="70" height="44" rx="12" fill="#181a28" stroke="#2e344e" stroke-width="1.5"/>
      <text x="35" y="20" fill="#38bdf8" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">↓ 48 MB/s</text>
      <text x="35" y="35" fill="#4ade80" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ 100%</text>
    </g>
  </g>

  <!-- ================= BRAND TYPOGRAPHY ================= -->
  <g transform="translate(256, 422)">
    <text x="0" y="0" font-family="Segoe UI, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">PINN-NOTCH</text>
    <text x="0" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2.5" text-anchor="middle">DYNAMIC SHELL FOR WINDOWS</text>
  </g>
</svg>